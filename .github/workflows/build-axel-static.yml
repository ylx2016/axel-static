name: build-axel-static

# Binaries are committed straight to the default branch root, together with
# SHA256SUMS and the generated README block: axel-x86_64-linux-musl,
# axel-aarch64-linux-musl. Layout and flow follow
# https://github.com/ylx2016/busybox-static-binaries-fat
#   - compile job: read-only token, builds in an ephemeral Alpine container
#   - commit job: needs the whole matrix, gets contents: write, re-stages the
#     artifacts, re-writes README/SHA256SUMS and pushes

on:
  workflow_dispatch:
    inputs:
      axel_version:
        description: "axel source version (e.g. 2.17.14)"
        required: true
        default: "2.17.14"
      axel_sha256:
        description: "sha256 of axel-<version>.tar.xz; MUST be updated when the version changes, empty fails closed"
        required: false
        default: "938ee7c8c478bf6fcc82359bbf9576f298033e8b13908e53e3ea9c45c1443693"
  push:
    tags: ["v*"]

permissions:
  contents: read

# Parallel runs would compile bit-different binaries and race on the same
# commit target / SHA256SUMS filename.
concurrency:
  group: axel-static-build
  cancel-in-progress: false

env:
  AXEL_VERSION: ${{ github.event.inputs.axel_version || '2.17.14' }}
  # pinned upstream tarball digest; the build refuses to run without a match
  AXEL_SHA256: ${{ github.event.inputs.axel_sha256 || '938ee7c8c478bf6fcc82359bbf9576f298033e8b13908e53e3ea9c45c1443693' }}
  # number of matrix rows; a short artifact set must never produce a partial SHA256SUMS
  EXPECTED_BINS: 2

jobs:
  compile:
    name: build-${{ matrix.suffix }}
    # Deliberately NOT `container: alpine`: JavaScript actions (upload-artifact)
    # inside an Alpine container are x64-only on GitHub runners and fail on
    # ubuntu-24.04-arm with "JavaScript Actions in Alpine containers are only
    # supported on x64 Linux runners". All Alpine work runs via `docker run`
    # against the runner's native arch instead; artifact steps stay on the host.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # native amd64 runner; UPX has no ELF/aarch64 writer (UPX 5.3 NEWS only
          # lists linux/riscv64 and win64/arm64 as recent additions), so arm64 is
          # shipped uncompressed.
          - suffix: x86_64-linux-musl
            runner: ubuntu-24.04
            do_upx: "1"
          - suffix: aarch64-linux-musl
            runner: ubuntu-24.04-arm
            do_upx: ""
    steps:
      - name: Build, pack and smoke-test in Alpine
        env:
          # must NOT be named UPX: UPX reads that variable as its own option string
          # and aborts with "invalid string '1' in environment variable 'UPX'"
          DO_UPX: ${{ matrix.do_upx }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          set -eux
          mkdir -p dist
          docker run --rm \
            -e AXEL_VERSION -e AXEL_SHA256 -e DO_UPX -e SUFFIX \
            -v "$PWD/dist:/dist" \
            alpine:3.20 sh -euxc '
              # busybox-extras carries the httpd applet; Alpine base busybox has none
              apk add --no-cache \
                build-base binutils busybox-extras curl file openssl-dev \
                openssl-libs-static pkgconf tar upx xz zlib-dev zlib-static

              # workflow_dispatch inputs are free-form: reject anything that is not
              # a plain x.y.z version before it reaches a URL or an output path
              case "$AXEL_VERSION" in
                ""|*[!0-9.]*) echo "invalid axel_version: $AXEL_VERSION"; exit 1 ;;
              esac
              echo "$AXEL_SHA256" | grep -qE "^[0-9a-f]{64}$" || {
                echo "invalid or missing axel_sha256"; exit 1;
              }

              curl -fsSL --proto "=https" --tlsv1.2 --retry 3 -o /tmp/axel.tar.xz \
                "https://github.com/axel-download-accelerator/axel/releases/download/v${AXEL_VERSION}/axel-${AXEL_VERSION}.tar.xz"
              echo "${AXEL_SHA256}  /tmp/axel.tar.xz" | sha256sum -c -
              tar -xJf /tmp/axel.tar.xz -C /tmp
              test -x "/tmp/axel-${AXEL_VERSION}/configure"
              cd "/tmp/axel-${AXEL_VERSION}"

              ./configure \
                --with-ssl=openssl \
                --disable-nls \
                CFLAGS="-O2 -ffunction-sections -fdata-sections" \
                LDFLAGS="-static -Wl,--gc-sections -Wl,--build-id=none"
              make -j"$(nproc)"
              bin="$(find . -maxdepth 2 -type f -name axel -perm -u+x | head -n1)"
              test -n "$bin"
              strip --strip-all "$bin" -o /tmp/axel
              ls -l /tmp/axel

              if readelf -d /tmp/axel 2>/dev/null | grep -q NEEDED; then
                echo "binary still has dynamic dependencies"
                readelf -d /tmp/axel
                exit 1
              fi
              file /tmp/axel | grep -q "statically linked"

              if [ "$DO_UPX" = "1" ]; then
                # --best --lzma = highest ratio at sane runtime; --ultra-brute is
                # smaller but takes minutes to hours.
                upx --best --lzma -o /tmp/axel.upx /tmp/axel
                mv /tmp/axel.upx /tmp/axel
                upx -t /tmp/axel
                chmod +x /tmp/axel
              fi
              ls -l /tmp/axel

              cd /tmp
              ./axel --version
              mkdir -p www
              dd if=/dev/urandom of=www/payload.bin bs=1M count=16 status=none
              # daemonizes without -f; busyboxconfig-extras enables
              # CONFIG_FEATURE_HTTPD_RANGES, so 206 must come back or the
              # multi-connection check below is meaningless
              /usr/sbin/httpd -p 8099 -h /tmp/www
              sleep 1
              code="$(curl -s -o /dev/null -w "%{http_code}" -r 0-99 http://127.0.0.1:8099/payload.bin)"
              test "$code" = "206"
              ./axel -n 4 -o out.bin http://127.0.0.1:8099/payload.bin
              cmp www/payload.bin out.bin

              # static OpenSSL bakes OPENSSLDIR of the build openssl (/etc/ssl),
              # so targets need a system CA store at /etc/ssl/certs
              apk add --no-cache ca-certificates
              ./axel -n 2 -o example.html https://example.com/
              grep -qi "<html" example.html

              cp /tmp/axel "/dist/axel-${SUFFIX}"
              chmod +x "/dist/axel-${SUFFIX}"
              ls -l "/dist/axel-${SUFFIX}"
            '

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bin-${{ matrix.suffix }}
          path: dist/axel-${{ matrix.suffix }}
          if-no-files-found: error
          retention-days: 1

  commit:
    # needs: compile is all-or-nothing: any arch failing skips the commit instead
    # of publishing a partial binary set.
    needs: compile
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # Actions are pinned to 40-char commit SHAs: a moved tag could otherwise push
      # arbitrary content under this job's write token.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: main
          # keep the credential: this job exists to push, and git-auto-commit-action
          # has no token input -- it relies on .git/config written by checkout
          persist-credentials: true

      - name: Download binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bin-*
          # not relying on merge-multiple: if it does not take effect the files land
          # in <path>/<artifact-name>/ and a flat glob would be empty. Collect
          # recursively instead so both layouts work.
          path: main/_dl

      - name: Stage binaries into repo root
        working-directory: main
        run: |
          set -euo pipefail
          shopt -s nullglob
          rm -f axel-* SHA256SUMS

          found=()
          while IFS= read -r -d '' f; do found+=("$f"); done \
            < <(find _dl -type f -name 'axel-*' -print0 2>/dev/null)
          echo "found ${#found[@]} binaries (expected ${EXPECTED_BINS})"
          printf '  %s\n' "${found[@]}"

          if [ "${#found[@]}" -ne "${EXPECTED_BINS}" ]; then
            echo "binary count ${#found[@]} != expected ${EXPECTED_BINS}"
            find _dl -maxdepth 3 -ls || true
            exit 1
          fi

          for f in "${found[@]}"; do
            base="$(basename "$f")"
            if [ -e "$base" ]; then echo "duplicate binary name: $base"; exit 1; fi
            mv "$f" .
          done
          rm -rf _dl
          chmod +x axel-*

          # Hash before anything executes the binaries below: if a binary is dirty it
          # could rewrite other files on this runner, making a later SHA256SUMS a
          # valid-looking but poisoned manifest.
          sha256sum axel-* > .pre-exec.sha256
          cat .pre-exec.sha256

      - name: Install qemu for the arm64 README run
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-user-static file

      - name: Assert ELF arch matches filename
        working-directory: main
        run: |
          set -euo pipefail
          # A binary whose filename lies about its arch is the worst kind of bad
          # artifact: downstream picks it by name and only fails on the target host.
          while IFS='|' read -r suffix bits data mach; do
            [ -n "$suffix" ] || continue
            f="axel-$suffix"
            [ -f "$f" ] || { echo "missing binary $f"; exit 1; }
            out="$(file -b "$f")"
            case "$out" in
              "ELF $bits-bit $data"*) ;;
              *) echo "$f width/endianness mismatch: $out"; exit 1 ;;
            esac
            case "$out" in
              *"$mach"*) ;;
              *) echo "$f machine mismatch: $out"; exit 1 ;;
            esac
          done <<'EOF'
          x86_64-linux-musl|64|LSB|x86-64
          aarch64-linux-musl|64|LSB|aarch64
          EOF

      - name: Regenerate README binary block
        working-directory: main
        env:
          UPX_NOTE: "x86_64 is UPX (--best --lzma) compressed; aarch64 ships uncompressed"
        run: |
          set -euo pipefail
          touch README.md
          # everything above the marker is hand-written docs and is preserved;
          # everything below it is regenerated on every build
          awk '/^<!-- binaries -->$/{exit} {print}' README.md > README.head
          {
            cat README.head
            echo '<!-- binaries -->'
            echo
            echo "## axel v${AXEL_VERSION} static binaries"
            echo
            echo "Built from the official release tarball (sha256 \`${AXEL_SHA256}\`)."
            echo
            echo '```console'
            echo '$ file axel-*'
            file axel-*
            echo
            echo '$ ./axel-x86_64-linux-musl --version | sed -n 1p'
            ./axel-x86_64-linux-musl --version | sed -n 1p
            echo
            echo '$ qemu-aarch64-static ./axel-aarch64-linux-musl --version | sed -n 1p'
            qemu-aarch64-static ./axel-aarch64-linux-musl --version | sed -n 1p
            echo
            echo '$ sha256sum axel-*'
            sha256sum axel-*
            echo '```'
          } > README.md
          rm -f README.head

          # re-check after qemu executed the aarch64 binary: if it rewrote any
          # axel-* file, this fails before a dirty hash reaches SHA256SUMS
          sha256sum -c .pre-exec.sha256
          rm -f .pre-exec.sha256

      - name: Generate SHA256SUMS
        working-directory: main
        run: |
          set -euo pipefail
          count="$(find . -maxdepth 1 -type f -name 'axel-*' | wc -l)"
          if [ "$count" -ne "${EXPECTED_BINS}" ]; then
            echo "binary count $count != expected ${EXPECTED_BINS}; refusing a partial SHA256SUMS"
            ls -l
            exit 1
          fi
          sha256sum axel-* > SHA256SUMS
          cat SHA256SUMS

      - uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5
        with:
          repository: ./main
          # no token input: the action has none, checkout's credential is used
          # only the files this pipeline produces are committed
          file_pattern: "axel-* README.md SHA256SUMS"
          commit_message: "Auto-build axel ${{ env.AXEL_VERSION }} static linux binaries"
