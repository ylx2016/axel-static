name: build-axel-static

on:
  workflow_dispatch:
    inputs:
      axel_version:
        description: "axel source version (e.g. 2.17.14)"
        required: true
        default: "2.17.14"
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  AXEL_VERSION: ${{ github.event.inputs.axel_version || '2.17.14' }}

jobs:
  build:
    name: axel-linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: alpine:3.20
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # native amd64 runner, static musl build, UPX packed
          - arch: amd64
            runner: ubuntu-24.04
            upx: "1"
          # native arm64 runner (public repos: free; private repos need a paid plan)
          # UPX has no ELF/aarch64 writer (UPX 5.3 NEWS: only linux/riscv64 and
          # win64/arm64 were added recently), so arm64 ships uncompressed.
          - arch: arm64
            runner: ubuntu-24.04-arm
            upx: ""
    steps:
      - name: Install toolchain
        run: |
          apk add --no-cache \
            build-base binutils curl file openssl-dev openssl-libs-static \
            pkgconf tar upx xz zlib-dev zlib-static

      - name: Fetch source
        run: |
          set -eux
          curl -fsSL -o /tmp/axel.tar.xz \
            "https://github.com/axel-download-accelerator/axel/releases/download/v${AXEL_VERSION}/axel-${AXEL_VERSION}.tar.xz"
          tar -xJf /tmp/axel.tar.xz -C /tmp
          test -x "/tmp/axel-${AXEL_VERSION}/configure"

      - name: Build static binary
        run: |
          set -eux
          cd "/tmp/axel-${AXEL_VERSION}"
          ./configure \
            --with-ssl=openssl \
            --disable-nls \
            CFLAGS="-O2 -ffunction-sections -fdata-sections" \
            LDFLAGS="-static -Wl,--gc-sections -Wl,--build-id=none"
          make -j"$(nproc)"
          bin="$(find . -maxdepth 2 -type f -name axel -perm -u+x | head -n1)"
          test -n "$bin"
          strip --strip-all "$bin" -o /tmp/axel
          ls -l /tmp/axel

      - name: Verify statically linked
        run: |
          set -eux
          if readelf -d /tmp/axel 2>/dev/null | grep -q NEEDED; then
            echo "::error::binary still has dynamic dependencies"
            readelf -d /tmp/axel
            exit 1
          fi
          file /tmp/axel
          file /tmp/axel | grep -q "statically linked"

      - name: UPX max compression
        if: matrix.upx == '1'
        run: |
          set -eux
          # --best --lzma = highest ratio at sane runtime; swap in --ultra-brute
          # for the absolute smallest result (minutes to hours, not seconds).
          upx --best --lzma -o /tmp/axel.upx /tmp/axel
          mv /tmp/axel.upx /tmp/axel
          upx -t /tmp/axel
          chmod +x /tmp/axel
          ls -l /tmp/axel

      - name: Smoke test (offline HTTP + HTTPS)
        run: |
          set -eux
          cd /tmp
          ./axel --version

          mkdir -p www
          dd if=/dev/urandom of=www/payload.bin bs=1M count=16 status=none
          busybox httpd -p 8099 -h /tmp/www
          sleep 1
          ./axel -n 4 -o out.bin http://127.0.0.1:8099/payload.bin
          cmp www/payload.bin out.bin

          # static OpenSSL bakes OPENSSLDIR of the build openssl (/etc/ssl),
          # so the target needs a system CA store at /etc/ssl/certs.
          apk add --no-cache ca-certificates
          ./axel -n 2 -o example.html https://example.com/
          grep -qi "<html" example.html

      # both arches produce a file literally named "axel"; rename before upload so
      # merge-multiple in the verify job cannot overwrite one artifact with the other
      - name: Stage binary
        run: |
          set -eux
          suffix=""
          if [ "${{ matrix.upx }}" = "1" ]; then suffix="-upx"; fi
          out="axel-${AXEL_VERSION}-linux-${{ matrix.arch }}${suffix}"
          mkdir -p /tmp/dist
          cp /tmp/axel "/tmp/dist/${out}"
          chmod +x "/tmp/dist/${out}"
          ls -l "/tmp/dist/${out}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ format('axel-{0}-linux-{1}{2}', env.AXEL_VERSION, matrix.arch, matrix.upx == '1' && '-upx' || '') }}
          path: /tmp/dist/*
          if-no-files-found: error

  verify:
    name: verify-on-distros
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: docker/setup-qemu-action@v3

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: axel-*
          merge-multiple: true

      - name: List artifacts
        run: ls -lR dist

      - name: Run on amd64 distros
        run: |
          set -eux
          bin="dist/axel-${AXEL_VERSION}-linux-amd64-upx"
          chmod +x "$bin"
          for img in alpine:3.20 debian:12 ubuntu:24.04 rockylinux:9; do
            echo "== $img"
            docker run --rm -v "$PWD/dist:/d:ro" "$img" \
              "/d/$(basename "$bin")" --version
            docker run --rm -v "$PWD/dist:/d:ro" "$img" \
              "/d/$(basename "$bin")" -n 2 -o /tmp/x https://example.com/ || true
          done

      - name: Run on arm64 (qemu)
        run: |
          set -eux
          chmod +x dist/axel-${AXEL_VERSION}-linux-arm64
          docker run --rm --platform linux/arm64 -v "$PWD/dist:/d:ro" \
            debian:12 "/d/axel-${AXEL_VERSION}-linux-arm64" --version
